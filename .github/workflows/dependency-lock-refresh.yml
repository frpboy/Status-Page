name: Dependency vulnerability lockfile remediation
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
permissions:
  contents: write
jobs:
  remediate:
    if: github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'security/dependency-remediation-')
    runs-on: ubuntu-latest
    steps:
      - name: Check out remediation branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Apply compatible npm security fixes and refresh lockfile
        run: |
          npm audit fix --package-lock-only --lockfile-version=3 --ignore-scripts --no-fund || true
          npm install --package-lock-only --lockfile-version=3 --ignore-scripts --no-audit --no-fund
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No package-lock changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): refresh lockfile after audit fix"
          git push origin HEAD:${{ github.head_ref }}
